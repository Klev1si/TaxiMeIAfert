workflows:

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS — builds a signed IPA and uploads it to TestFlight
  # ─────────────────────────────────────────────────────────────────────────────
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      # NOTE: deliberately no `ios_signing` block here. That triggers
      # Codemagic's *automatic* code-signing pre-flight check, which looks
      # for a profile via Team settings → Code signing identities — a
      # separate setup path from the App Store Connect API key vars below.
      # Since that identity was never configured there, it failed before
      # any of our scripts even ran ("No matching profiles found ...").
      # Signing is instead handled manually below via fetch-signing-files +
      # keychain initialize + xcode-project use-profiles.

      # The three APP_STORE_CONNECT_* secrets live in this Codemagic variable
      # group (Codemagic UI → Environment variables → group "app_store_connect"),
      # imported here so they're available to the scripts below as $VAR.
      groups:
        - app_store_connect

      vars:
        BUNDLE_ID:            com.taximelafert
        XCODE_SCHEME:         TaxiMobile
        XCODE_WORKSPACE:      ios/TaxiMobile.xcworkspace
        P12_PASSWORD:         codemagic_ci_ephemeral
        # Apple App Store Connect application id (numeric) — used to look up the
        # latest uploaded build number so each build auto-increments above it.
        APP_STORE_APP_ID:     6786225522

      # Metro (via @react-native/metro-config) uses Array.prototype.toReversed(),
      # an ES2023 method requiring Node 20+ — v18 throws "toReversed is not a
      # function" during the "Bundle React Native code and images" phase.
      # Matches the Node version already used successfully by EAS builds (see
      # TaxiMobile/eas.json build.production.node).
      node: 22.11.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Set up signing certificate
        # Keychain must exist before anything gets imported into it.
        script: keychain initialize

      - name: Set up App Store Connect API key
        # An IOS_DISTRIBUTION certificate for this account already exists
        # (created by an earlier run with this same CERTIFICATE_PRIVATE_KEY),
        # so `certificates create` 409s trying to make a second one. Passing
        # --certificate-key here instead lets fetch-signing-files find and
        # pair that EXISTING certificate with our known private key, rather
        # than attempting to create a new one.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --p12-password="$P12_PASSWORD" \
            --create
          # fetch-signing-files saves the paired cert to the default
          # certificates dir but does NOT import it into the active build
          # keychain — xcodebuild's identity search only checks the actual
          # keychain, so do that explicitly.
          keychain add-certificates \
            --certificate="$HOME/Library/Developer/Xcode/UserData/Certificates/*.p12" \
            --certificate-password="$P12_PASSWORD"

      - name: Set up code signing settings on Xcode project
        script: |
          cd TaxiMobile
          xcode-project use-profiles

      - name: Install npm dependencies
        script: |
          cd TaxiMobile
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd TaxiMobile/ios
          pod install

      - name: Set iOS build number (App Store Connect latest + 1)
        # CFBundleVersion (CURRENT_PROJECT_VERSION) must be strictly greater than
        # any build already uploaded, or App Store Connect rejects the upload.
        # Fetch the latest build number for the app and set the next one. If the
        # lookup fails for any reason, fall back to the value committed in the
        # Xcode project (kept correct in project.pbxproj) so the build still runs.
        script: |
          cd TaxiMobile/ios
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" 2>/dev/null || true)
          if echo "$LATEST" | grep -qE '^[0-9]+$'; then
            NEW=$(( LATEST + 1 ))
            echo "Latest uploaded build: $LATEST → setting build number to $NEW"
            agvtool new-version -all "$NEW"
          else
            echo "Could not fetch latest build number; using project value ($(agvtool what-version -terse))"
          fi

      - name: Build iOS IPA
        script: |
          cd TaxiMobile
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --disable-xcpretty

    artifacts:
      - TaxiMobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        # References the three vars defined above directly, so no separate
        # "named integration" needs to be configured in Codemagic's UI.
        api_key:   $APP_STORE_CONNECT_PRIVATE_KEY
        key_id:    $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Upload to TestFlight first for testing
        submit_to_testflight: true
        # Set to true only when ready for full App Store review
        submit_to_app_store: false
      email:
        recipients:
          - klevisschool2406@gmail.com
        notify:
          success: true
          failure: true
