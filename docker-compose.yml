services:
  postgres:
    image: postgres:16.3
    container_name: taxiapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxiapp
      POSTGRES_PASSWORD: taxiapp_dev_password
      POSTGRES_DB: taxiapp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxiapp -d taxiapp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: taxiapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: