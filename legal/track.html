<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live trip — TaxiMeIAfert</title>
  <meta name="description" content="Follow your TaxiMeIAfert ride in real time." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#eab308" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b;
      --primary:#eab308; --border:#e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --border:#334155; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
           background:var(--bg); color:var(--text); }
    header { padding:14px 18px; border-bottom:1px solid var(--border); background:var(--card); display:flex; align-items:center; gap:10px; }
    header .logo { font-size:24px; }
    header h1 { font-size:16px; margin:0; font-weight:800; }
    header p  { margin:0; font-size:12px; color:var(--muted); }
    main { padding:14px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
    .status { display:inline-block; padding:4px 10px; border-radius:10px; font-size:12px; font-weight:700; background:var(--primary); color:#000; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
    .row:last-child { border-bottom:none; }
    .row .label { color:var(--muted); font-size:13px; }
    .row .value { font-size:14px; font-weight:600; text-align:right; }
    #map { width:100%; height:300px; border-radius:14px; border:1px solid var(--border); }
    .empty { padding:48px 24px; text-align:center; color:var(--muted); }
    .empty .icon { font-size:48px; margin-bottom:12px; }
    footer { margin-top:18px; text-align:center; color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">🚕</span>
    <div>
      <h1>TaxiMeIAfert · Live trip</h1>
      <p id="last-update">Connecting…</p>
    </div>
  </header>

  <main id="main">
    <div class="empty" id="loading">
      <div class="icon">⏳</div>
      <div>Loading trip…</div>
    </div>
  </main>

  <footer>
    <p>This link expires when the trip ends.</p>
    <p>Powered by <strong>TaxiMeIAfert</strong> — the simplest way to ride in Kosovo.</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Read token from query string. Show error if missing/invalid.
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    // Resolve API base — try the same Railway host the apps use.
    const API_BASE = 'https://taximeiafert-production.up.railway.app';
    const POLL_MS  = 5000;

    const STATUS_LABEL = {
      accepted:           'Driver assigned',
      driving_to_pickup:  'Driver on the way',
      arrived:            'Driver has arrived',
      in_progress:        'Trip in progress',
    };

    let map      = null;
    let driverMk = null;
    let pickupMk = null;
    let dropMk   = null;

    // Escape untrusted server values before inserting into innerHTML.
    // Driver name/plate and pickup/dropoff addresses are user-supplied free
    // text, so they must never be treated as markup.
    function esc(v) {
      return String(v).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function showError(msg) {
      document.getElementById('main').innerHTML =
        '<div class="empty"><div class="icon">⚠️</div><div>' + esc(msg) + '</div></div>';
    }

    function renderUI(data) {
      const statusKey = data.status || 'accepted';
      const statusText = STATUS_LABEL[statusKey] || statusKey;

      // Build the static shell exactly ONCE. Previously this rebuilt the whole
      // #main innerHTML (including the <div id="map">) on every 5s poll, which
      // detached the node Leaflet was rendering into — so the map showed on the
      // first tick and then vanished on the next. Now we build the shell once
      // and only patch the dynamic text values on each poll.
      if (!document.getElementById('map')) {
        document.getElementById('main').innerHTML =
          '<div class="card">' +
          '  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">' +
          '    <span class="status" id="t-status"></span>' +
          '  </div>' +
          '  <div class="row"><span class="label">Driver</span><span class="value" id="t-driver"></span></div>' +
          '  <div class="row"><span class="label">Car plate</span><span class="value" id="t-plate"></span></div>' +
          '  <div class="row"><span class="label">From</span><span class="value" id="t-from"></span></div>' +
          '  <div class="row"><span class="label">To</span><span class="value" id="t-to"></span></div>' +
          '</div>' +
          '<div id="map"></div>';
        // The old map/marker objects (if any) pointed at the now-removed nodes;
        // drop them so a fresh map is created into the new container below.
        map = null; driverMk = null; pickupMk = null; dropMk = null;
      }

      // Patch the dynamic values in place. textContent is XSS-safe by design,
      // so the untrusted driver/address fields need no manual escaping here.
      document.getElementById('t-status').textContent = statusText;
      document.getElementById('t-driver').textContent = data.driverFirstName || '—';
      document.getElementById('t-plate').textContent  = data.driverPlate || '—';
      document.getElementById('t-from').textContent   = data.pickupAddress  || (data.pickupLat.toFixed(4)  + ', ' + data.pickupLng.toFixed(4));
      document.getElementById('t-to').textContent     = data.dropoffAddress || (data.dropoffLat.toFixed(4) + ', ' + data.dropoffLng.toFixed(4));

      if (!map) {
        map = L.map('map').setView([data.pickupLat, data.pickupLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap',
          maxZoom: 19,
        }).addTo(map);
      }

      // Pickup marker (green)
      if (!pickupMk) {
        pickupMk = L.marker([data.pickupLat, data.pickupLng], {
          title: 'Pickup',
        }).addTo(map);
      }
      // Dropoff marker
      if (!dropMk) {
        dropMk = L.marker([data.dropoffLat, data.dropoffLng], {
          title: 'Dropoff',
        }).addTo(map);
      }

      // Driver marker (live)
      if (data.driverLat != null && data.driverLng != null) {
        const pos = [data.driverLat, data.driverLng];
        if (!driverMk) {
          driverMk = L.circleMarker(pos, {
            radius: 9, color: '#eab308', fillColor: '#eab308', fillOpacity: 0.9,
          }).addTo(map);
          driverMk.bindTooltip('🚕 ' + esc(data.driverFirstName || 'Driver'), { permanent: true, direction: 'top' });
        } else {
          driverMk.setLatLng(pos);
        }
        map.panTo(pos);
      }

      document.getElementById('last-update').textContent =
        'Last updated ' + new Date().toLocaleTimeString();
    }

    async function tick() {
      if (!token) {
        showError('Missing tracking token in the URL.');
        return;
      }
      try {
        const res = await fetch(API_BASE + '/public/rides/track/' + encodeURIComponent(token), {
          headers: { Accept: 'application/json' },
        });
        if (res.status === 404) {
          showError('This trip has ended or the link has expired.');
          return; // stop polling
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderUI(data);
        setTimeout(tick, POLL_MS);
      } catch (err) {
        document.getElementById('last-update').textContent = 'Reconnecting…';
        setTimeout(tick, POLL_MS);
      }
    }

    tick();
  </script>
</body>
</html>
