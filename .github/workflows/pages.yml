# GitHub Pages deploy for legal/ folder (Privacy Policy, Terms, Delete Account).
#
# Replaces the auto-generated Pages workflow so we can pass `submodules: false`
# to actions/checkout. The auto workflow uses `submodules: true` by default
# and was failing with "No url found for submodule path '.claude/worktrees/...'"
# whenever a stray gitlink existed in the index.
name: Deploy legal pages to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Serve the legal/ pages at the site root so URLs are taximeiafert.com/
      # privacy.html — matching the canonical/OG/sitemap tags in the pages and
      # placing CNAME at the artifact root (the only place GitHub Pages reads
      # it). A backward-compatible /legal/ mirror is kept so the previously
      # published /legal/… URLs (referenced by Play Console) still resolve; the
      # pages' canonical tags point at the root copies, so search engines
      # consolidate there and the mirror isn't treated as duplicate content.
      - name: Stage Pages content
        run: |
          mkdir -p _site/legal
          cp -r legal/. _site/legal/   # /legal/ compatibility mirror
          cp -r legal/. _site/         # root — includes CNAME at _site/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
